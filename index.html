<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Solver</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }
    .btn {
      background: #2563eb;
      color: white;
      padding: 16px 28px;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      display: inline-block;
    }
    input[type="file"] { display: none; }
    #answer {
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: 32px;
      color: #4ade80;
      word-break: break-word;
      max-width: 90%;
    }
    #error {
      color: #f87171;
      font-size: 0.95rem;
      margin-top: 16px;
      max-width: 90%;
      white-space: pre-wrap;
    }
    .reset-btn {
      margin-top: 40px;
      background: transparent;
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <label class="btn">
    📸 Snap Question
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
  </label>

  <div id="answer">Ready</div>
  <div id="error"></div>

  <button class="reset-btn" onclick="resetKey()">Change API Key</button>

  <script>
    function getApiKey() {
      let key = localStorage.getItem("GEMINI_KEY");
      if (!key) {
        key = prompt("Enter your Gemini API Key:");
        if (key) localStorage.setItem("GEMINI_KEY", key.trim());
      }
      return key;
    }

    function resetKey() {
      localStorage.removeItem("GEMINI_KEY");
      alert("Key cleared. Reload the page to enter a new one.");
      location.reload();
    }

    const fileInput = document.getElementById('cameraInput');
    const answerDiv = document.getElementById('answer');
    const errorDiv = document.getElementById('error');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const apiKey = getApiKey();
      if (!apiKey) {
        answerDiv.innerText = "No API Key Provided";
        return;
      }

      answerDiv.innerText = "Solving...";
      errorDiv.innerText = "";

      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const rawData = reader.result;
          const mimeType = file.type || "image/jpeg";
          const base64Data = rawData.split(',')[1];

          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

          const payload = {
            contents: [{
              parts: [
                {
                  text: "You are an automated solver for exam questions. Solve the question in the image. Return ONLY the final option (A/B/C/D) or exact numerical answer. Do not include any explanations or extra words."
                },
                {
                  inlineData: {
                    mimeType: mimeType,
                    data: base64Data
                  }
                }
              ]
            }],
            generationConfig: {
              temperature: 0.1
            }
          };

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(`API Error [${response.status}]: ${data.error ? data.error.message : JSON.stringify(data)}`);
          }

          if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
            answerDiv.innerText = data.candidates[0].content.parts[0].text.trim();
          } else {
            answerDiv.innerText = "No answer returned";
            errorDiv.innerText = JSON.stringify(data, null, 2);
          }

        } catch (err) {
          answerDiv.innerText = "Failed";
          errorDiv.innerText = err.message;
          console.error(err);
        }
      };

      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
