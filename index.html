<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Solver</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #121212; color: #fff; }
    #answer { font-size: 2rem; font-weight: bold; margin-top: 24px; color: #4ade80; text-align: center; }
    .btn { background: #2563eb; color: white; padding: 16px 32px; border-radius: 12px; font-size: 1.2rem; cursor: pointer; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <label class="btn">
    📸 Snap Question
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
  </label>
  <div id="answer">Ready</div>

  <script>
    const API_KEY = "YOUR_GEMINI_API_KEY";
    const fileInput = document.getElementById('cameraInput');
    const answerDiv = document.getElementById('answer');

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      answerDiv.innerText = "Solving...";

      const reader = new FileReader();
      reader.onload = async () => {
        const base64Data = reader.result.split(',')[1];
        
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${AQ.Ab8RN6KU_3P3UyXMzceNirZLrBssYkM1I4H_5Gm6fcRQFHDO9w}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: "Solve this question. Return ONLY the final MCQ option or numerical answer." },
                  { inline_data: { mime_type: file.type, data: base64Data } }
                ]
              }]
            })
          });
          const data = await res.json();
          answerDiv.innerText = data.candidates[0].content.parts[0].text.trim();
        } catch (err) {
          answerDiv.innerText = "Error fetching answer";
        }
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
